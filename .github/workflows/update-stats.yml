name: Update Stats Data

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 6am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Baseball: clone repo, process stats, copy JSON
      - name: Fetch baseball stats
        run: |
          git clone --depth 1 https://github.com/doyled-it/obsidian-baseball.git /tmp/baseball
          cd /tmp/baseball
          npm install --production
          node process-stats.js
          cp stats-data.json $GITHUB_WORKSPACE/src/_data/baseball.json

      # Golf: run the (working) GHIN fetcher with our secrets, write the file the site reads
      - name: Fetch golf stats
        env:
          GHIN_USERNAME: ${{ secrets.GHIN_USERNAME }}
          GHIN_PASSWORD: ${{ secrets.GHIN_PASSWORD }}
        run: |
          git clone --depth 1 https://github.com/doyled-it/golf-stats.git /tmp/golf
          cd /tmp/golf
          npm ci
          npm run fetch-data
          cp ghin-data.json $GITHUB_WORKSPACE/src/_data/golf-raw.json

      # League: SDABL schedule, scores and standings from the public SportsEngine API (no auth)
      - name: Fetch SDABL league data
        run: node scripts/fetch-sdabl.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/_data/baseball.json src/_data/golf-raw.json src/_data/league.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/baseball.json src/_data/golf-raw.json src/_data/league.json
          git commit -m "chore: update baseball and golf stats data"
          git push

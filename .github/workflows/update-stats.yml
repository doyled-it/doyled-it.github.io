name: Update Stats Data

# Baseball personal stats only. The obsidian-baseball repo is public and has no
# IP restrictions, so this runs fine on GitHub-hosted runners. Golf (GHIN) and
# the league schedule (sdabl1.info) both block datacenter IPs, so they live in
# update-stats-local.yml on a self-hosted runner instead.
on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Baseball: clone repo, process stats, copy JSON
      - name: Fetch baseball stats
        run: |
          git clone --depth 1 https://github.com/doyled-it/obsidian-baseball.git /tmp/baseball
          cd /tmp/baseball
          npm install --production
          node process-stats.js
          cp stats-data.json $GITHUB_WORKSPACE/src/_data/baseball.json

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/_data/baseball.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/baseball.json
          git commit -m "chore: update baseball stats data"
          git push

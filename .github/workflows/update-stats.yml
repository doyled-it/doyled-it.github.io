name: Update Stats Data

on:
  schedule:
    - cron: '0 10 * * *'  # Daily at 10:00 UTC (3am PDT / 2am PST), after evening range sessions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Baseball: clone repo, process stats, copy JSON
      - name: Fetch baseball stats
        run: |
          git clone --depth 1 https://github.com/doyled-it/obsidian-baseball.git /tmp/baseball
          cd /tmp/baseball
          npm install --production
          node process-stats.js
          cp stats-data.json $GITHUB_WORKSPACE/src/_data/baseball.json

      # Golf: run the (working) GHIN fetcher with our secrets, write the file the site reads
      - name: Fetch golf stats
        env:
          GHIN_USERNAME: ${{ secrets.GHIN_USERNAME }}
          GHIN_PASSWORD: ${{ secrets.GHIN_PASSWORD }}
        run: |
          git clone --depth 1 https://github.com/doyled-it/golf-stats.git /tmp/golf
          cd /tmp/golf
          npm ci
          npm run fetch-data
          cp ghin-data.json $GITHUB_WORKSPACE/src/_data/golf-raw.json

      # League: SDABL schedule, scores and standings from the public SportsEngine API (no auth)
      - name: Fetch SDABL league data
        run: node scripts/fetch-sdabl.mjs

      # Range: MLM2PRO sessions from Rapsodo RCloud (unofficial API, login with secrets).
      # Allowed to fail so a Rapsodo change can't block the other stats updates.
      - name: Fetch MLM2PRO range sessions
        continue-on-error: true
        env:
          MLM_EMAIL: ${{ secrets.MLM_EMAIL }}
          MLM_PASSWORD: ${{ secrets.MLM_PASSWORD }}
        run: node scripts/fetch-mlm.mjs

      # Projects: refresh the live GitHub descriptions for the projects page.
      - name: Refresh project descriptions
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-projects.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/_data/baseball.json src/_data/golf-raw.json src/_data/league.json src/_data/mlm.json src/_data/github-repos.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/baseball.json src/_data/golf-raw.json src/_data/league.json src/_data/mlm.json src/_data/github-repos.json
          git commit -m "chore: update stats and project data"
          git push

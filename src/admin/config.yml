backend:
  name: github
  repo: doyled-it/words
  branch: main
media_folder: media
public_folder: /media
site_url: https://doyled-it.com
collections:
  - name: posts
    label: Words
    label_singular: Post
    folder: posts
    path: "{{slug}}/index"
    media_folder: images
    public_folder: images
    slug: "{{slug}}"
    create: true
    sortable_fields: [date, title]
    summary: "{{title}} ({{published}})"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: published, label: Published, widget: boolean, default: false }
      - { name: description, label: Description, widget: string, required: false }
      - { name: body, label: Body, widget: markdown }
